<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Registro de la Biblioteca</h1>
        <form action="#" class="formulario">
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="campo">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="documento">Documento</label>
                    <input type="text" id="documento" name="documento" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo Electronico</label>
                    <input type="email" name="correo" id="correo" required>
                </div>

                <div class="campo">
                    <label for="nacimiento">Fecha de Nacimiento</label>
                    <input type="date" name="nacimiento" id="nacimiento" min="1900-01-01">
                </div>

                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" name="clave" id="clave" required minlength="8">
                </div>

                <div class="campo">
                    <label for="edad">Edad</label>
                    <input type="number" name="edad" id="edad" min="0" max="120">
                </div>

            </fieldset>
            <fieldset>
                <legend>Tú Perfil</legend>
                <div class="campo">
                    <label for="tipo">Tipo de Usuario</label>
                    <select name="tipo" id="tipo" required>
                        <option value="">Elige una opción</option>
                        <option value="aprendiz">Aprendiz</option>
                        <option value="instructor">Instructor</option>
                        <option value="visitante">Visitante</option>
                    </select>
                </div>

                 <fieldset class="grupo">
                    <legend>Sede</legend>
                    <label class="opcion"><input type="radio" name="sede" value="norte"> Norte</label>
                    <label class="opcion"><input type="radio" name="sede" value="centro"> Centro</label>
                    <label class="opcion"><input type="radio" name="sede" value="sur"> Sur</label>
                </fieldset>

                <fieldset class="grupo">
                    <legend>Temas que te interesan</legend>
                    <label for="novelas" class="opcion">
                        <input type="checkbox" name="temas" id="novelas" value="novelas">Novelas
                    </label>

                    <label for="ciencia" class="opcion">
                        <input type="checkbox" name="temas" id="ciencia" value="ciencia">Ciencia
                    </label>

                    <label for="tecnologia" class="opcion">
                        <input type="checkbox" name="temas" id="tecnologia" value="tecnologia">Tecnologia
                    </label>

                </fieldset>

                <div class="campo">
                    <label for="comentario">¿Qué libro te gustaría que tuvieramos?</label>
                    <textarea name="comentario" id="comentario" rows="4"></textarea>
                </div>

            </fieldset>
            
            <button type="submit" class="boton">Registrarme</button>
        </form>
    </main>
</body>
</html>
